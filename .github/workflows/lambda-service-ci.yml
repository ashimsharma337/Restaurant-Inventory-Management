name: Lambda Service CI

on:
  push:
    paths:
      - 'lambda-service/**'
      - '.github/workflows/lambda-service-ci.yml'
  pull_request:
    paths:
      - 'lambda-service/**'
      - '.github/workflows/lambda-service-ci.yml'

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: lambda-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest -v --tb=short