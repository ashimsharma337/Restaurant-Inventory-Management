name: Lambda Service CI

on:
  push:
    paths:
      - 'lambda-service/**'
      - '.github/workflows/lambda-service-ci.yml'
  pull_request:
    paths:
      - 'lambda-service/**'
      - '.github/workflows/lambda-service-ci.yml'

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: lambda-service/invoice-processor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: lambda-service/invoice-processor
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest -v --tb=short